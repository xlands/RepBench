  .chip .cnt { color: var(--text-muted); }
  #clusterlist { flex: 1; overflow-y: auto; min-height: 0; }
  .row {
    padding: 8px 12px; border-bottom: 1px solid var(--grid); cursor: pointer;

  #detail {

const SLOT_VARS = ['--series-1','--series-2','--series-3','--series-4','--series-5','--series-6','--series-7','--series-8'];
const css = name => getComputedStyle(document.body).getPropertyValue(name).trim();

let famColor = {};   // family -> resolved color (top 8 slots; rest fold)
function resolveColors() {
  famColor = {};
  DATA.families.forEach((f, i) => {
    famColor[f.key] = i < 8 ? css(SLOT_VARS[i]) : css('--fold');
  });
}

const pts = DATA.points;            // [x, y, clusterIdx, mentions, name]
const clusters = DATA.clusters;
clusters.forEach(c => { c.cx = 0; c.cy = 0; c.np = 0; });
let xmin = 1e9, xmax = -1e9, ymin = 1e9, ymax = -1e9;
for (const p of pts) {
  const c = clusters[p[2]];
  c.cx += p[0]; c.cy += p[1]; c.np++;
  if (p[0] < xmin) xmin = p[0]; if (p[0] > xmax) xmax = p[0];
  if (p[1] < ymin) ymin = p[1]; if (p[1] > ymax) ymax = p[1];
}
clusters.forEach(c => { if (c.np) { c.cx /= c.np; c.cy /= c.np; } });

const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');
let W = 0, H = 0, DPR = window.devicePixelRatio || 1;
let view = { s: 1, tx: 0, ty: 0 };   // screen = world*s + t
let selected = -1;                   // cluster index
let isolatedFams = new Set();
let hoverIdx = -1;

function fitView() {
  const pad = 40;
  const s = Math.min((W - 2*pad) / (xmax - xmin), (H - 2*pad) / (ymax - ymin));
  view.s = s;
  view.tx = (W - s * (xmin + xmax)) / 2;
  view.ty = (H - s * (ymin + ymax)) / 2;
}
function resize() {
  const r = canvas.getBoundingClientRect();
  W = r.width; H = r.height;
  canvas.width = W * DPR; canvas.height = H * DPR;
  fitView(); draw();
}
const sx = p => p[0] * view.s + view.tx;
const sy = p => p[1] * view.s + view.ty;

function ptRadius(m) { return 1.6 + Math.min(4.5, 0.55 * Math.sqrt(m)); }
function dimmed(p) {
  const fam = clusters[p[2]].family;
  if (isolatedFams.size && !isolatedFams.has(fam)) return true;
  if (selected >= 0 && p[2] !== selected) return true;
  return false;
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = css('--surface-1');
  ctx.fillRect(0, 0, W, H);
  // dimmed pass first, colored pass on top
  for (const pass of [true, false]) {
    for (const p of pts) {
      if (dimmed(p) !== pass) continue;
      const x = sx(p), y = sy(p);
      if (x < -10 || x > W + 10 || y < -10 || y > H + 10) continue;
      const r = ptRadius(p[3]);
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832);
      if (pass) { ctx.globalAlpha = 0.25; ctx.fillStyle = css('--fold'); }
      else { ctx.globalAlpha = 0.85; ctx.fillStyle = famColor[clusters[p[2]].family]; }
      ctx.fill(); ctx.globalAlpha = 1;
    }
  }
  // selected cluster: 2px surface ring on its points
  if (selected >= 0) {
    ctx.lineWidth = 2; ctx.strokeStyle = css('--surface-1');
    for (const p of pts) {
      if (p[2] !== selected) continue;
      const x = sx(p), y = sy(p);
      if (x < -10 || x > W + 10 || y < -10 || y > H + 10) continue;
      ctx.beginPath(); ctx.arc(x, y, ptRadius(p[3]) + 1, 0, 6.2832); ctx.stroke();
    }
  }
  // hover ring
  if (hoverIdx >= 0) {
    const p = pts[hoverIdx];
    ctx.beginPath(); ctx.arc(sx(p), sy(p), ptRadius(p[3]) + 2.5, 0, 6.2832);
    ctx.lineWidth = 2; ctx.strokeStyle = css('--text-secondary'); ctx.stroke();
  }
  drawLabels();
}

function drawLabels() {
  // direct labels for largest clusters, greedy collision skip, muted ink + surface halo
  const bySize = clusters.map((c, i) => i).sort((a, b) => clusters[b].mentions - clusters[a].mentions);
  const boxes = [];
  ctx.font = '11px system-ui, -apple-system, "Segoe UI", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let drawn = 0;
  for (const i of bySize) {
    if (drawn >= 32 && i !== selected) break;
    const c = clusters[i];
    if (isolatedFams.size && !isolatedFams.has(c.family)) continue;
    if (selected >= 0 && i !== selected) continue;
    const x = c.cx * view.s + view.tx, y = c.cy * view.s + view.ty;
    if (x < 20 || x > W - 20 || y < 10 || y > H - 10) continue;
    const w = ctx.measureText(c.name).width + 8, h = 15;
    const box = [x - w/2, y - h/2, x + w/2, y + h/2];
    if (boxes.some(b => box[0] < b[2] && box[2] > b[0] && box[1] < b[3] && box[3] > b[1])) continue;
    boxes.push(box);
    ctx.lineWidth = 3; ctx.strokeStyle = css('--surface-1');
    ctx.strokeText(c.name, x, y);
    ctx.fillStyle = i === selected ? css('--text-primary') : css('--text-secondary');
    ctx.fillText(c.name, x, y);
    drawn++;
  }
}

function nearestPoint(mx, my) {
  let best = -1, bestD = 100; // 10px hit radius
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    if (dimmed(p)) continue;
    const dx = sx(p) - mx, dy = sy(p) - my;
    const d = dx*dx + dy*dy;
    if (d < bestD) { bestD = d; best = i; }
  }
  return best;
}

// --- interactions ---
let dragging = false, moved = false, lx = 0, ly = 0;
canvas.addEventListener('mousedown', e => { dragging = true; moved = false; lx = e.offsetX; ly = e.offsetY; canvas.classList.add('dragging'); });
window.addEventListener('mouseup', () => { dragging = false; canvas.classList.remove('dragging'); });
canvas.addEventListener('mousemove', e => {
  if (dragging) {
    view.tx += e.offsetX - lx; view.ty += e.offsetY - ly;
    if (Math.abs(e.offsetX - lx) + Math.abs(e.offsetY - ly) > 2) moved = true;
    lx = e.offsetX; ly = e.offsetY;
    tooltip.style.display = 'none'; hoverIdx = -1; draw(); return;
  }
  const i = nearestPoint(e.offsetX, e.offsetY);
  if (i !== hoverIdx) { hoverIdx = i; draw(); }
  if (i >= 0) {
    const p = pts[i], c = clusters[p[2]];
    const famLabel = (DATA.families.find(f => f.key === c.family) || {}).label || c.family;
    tooltip.innerHTML = '<div class="t-name">' + p[4] + '</div>' +
      '<div class="t-cluster">簇: ' + c.name + '</div>' +
      '<div class="t-meta">' + famLabel + ' · 概念 mentions: ' + p[3] + ' · 簇 mentions: ' + c.mentions + '</div>';
    tooltip.style.display = 'block';
    const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
    tooltip.style.left = Math.min(e.offsetX + 14, W - tw - 8) + 'px';
    tooltip.style.top = Math.min(e.offsetY + 14, H - th - 8) + 'px';
    canvas.style.cursor = 'pointer';
  } else { tooltip.style.display = 'none'; canvas.style.cursor = dragging ? 'grabbing' : 'grab'; }
});
canvas.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; hoverIdx = -1; draw(); });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const f = Math.exp(-e.deltaY * 0.0015);
  const ns = Math.min(Math.max(view.s * f, 0.05), 400);
  const k = ns / view.s;
  view.tx = e.offsetX - k * (e.offsetX - view.tx);
  view.ty = e.offsetY - k * (e.offsetY - view.ty);
  view.s = ns; draw();
}, { passive: false });
canvas.addEventListener('click', e => {
  if (moved) return;
  const i = nearestPoint(e.offsetX, e.offsetY);
  if (i >= 0) selectCluster(pts[i][2], false);
  else if (selected >= 0) selectCluster(-1, false);
});
canvas.addEventListener('dblclick', () => { fitView(); draw(); });
document.getElementById('resetview').addEventListener('click', () => { fitView(); draw(); });
window.addEventListener('keydown', e => { if (e.key === 'Escape') selectCluster(-1, false); });

// --- sidebar ---
const listEl = document.getElementById('clusterlist');
const detailEl = document.getElementById('detail');
const searchEl = document.getElementById('search');

function famLabel(key) { return (DATA.families.find(f => f.key === key) || {}).label || key; }

function renderChips() {
  const el = document.getElementById('chips');
  el.innerHTML = '';
  DATA.families.forEach(f => {
    const chip = document.createElement('span');
    chip.className = 'chip' + (isolatedFams.has(f.key) ? ' active' : '');
    chip.innerHTML = '<span class="dot" style="background:' + famColor[f.key] + '"></span>' + f.label +
                     ' <span class="cnt">' + f.mentions + '</span>';
    chip.onclick = () => {
      if (isolatedFams.has(f.key)) isolatedFams.delete(f.key); else isolatedFams.add(f.key);
      renderChips(); renderList(); draw();
    };
    el.appendChild(chip);
  });
}

function renderList() {
  const q = searchEl.value.trim().toLowerCase();
  listEl.innerHTML = '';
  clusters.forEach((c, i) => {
    if (isolatedFams.size && !isolatedFams.has(c.family)) return;
    if (q && !(c.name.toLowerCase().includes(q) || c.definition.toLowerCase().includes(q) ||
               c.topConcepts.some(t => t.toLowerCase().includes(q)))) return;
    const row = document.createElement('div');
    row.className = 'row' + (i === selected ? ' selected' : '');
    row.innerHTML = '<span class="dot" style="background:' + famColor[c.family] + '"></span>' +
      '<span class="name">' + c.name + '</span>' +
      '<span class="n">' + c.mentions + ' / ' + c.benchmarks + '</span>';
    row.onclick = () => selectCluster(i, true);
    listEl.appendChild(row);
  });
}

function renderDetail() {
  if (selected < 0) { detailEl.style.display = 'none'; return; }
  const c = clusters[selected];
  detailEl.style.display = 'block';
  detailEl.innerHTML =
    '<h2><span class="dot" style="background:' + famColor[c.family] + '"></span>' + c.name +
    '<button class="close" title="关闭">×</button></h2>' +
    '<div class="def">' + c.definition + '</div>' +
    '<div class="meta">' + famLabel(c.family) + ' · mentions ' + c.mentions + ' · 去重 benchmark ' + c.benchmarks + ' · 概念 ' + c.concepts + '</div>' +
    '<div class="sec">代表概念</div><div class="items">' + c.topConcepts.join(', ') + '</div>' +
    '<div class="sec">代表 Benchmark</div><div class="items">' + c.topBenchmarks.join(', ') + '</div>';
  detailEl.querySelector('.close').onclick = () => selectCluster(-1, false);
}

function selectCluster(i, zoom) {
  selected = (i === selected && !zoom) ? -1 : i;
  if (selected >= 0 && zoom) {
    const xs = [], ys = [];
    for (const p of pts) if (p[2] === selected) { xs.push(p[0]); ys.push(p[1]); }
    xs.sort((a,b)=>a-b); ys.sort((a,b)=>a-b);
    const q = (arr, f) => arr[Math.min(arr.length - 1, Math.floor(f * arr.length))];
    const x0 = q(xs, 0.05), x1 = q(xs, 0.95), y0 = q(ys, 0.05), y1 = q(ys, 0.95);
    const pad = 80, spanX = Math.max(x1 - x0, 0.5), spanY = Math.max(y1 - y0, 0.5);
    view.s = Math.min((W - 2*pad) / spanX, (H - 2*pad) / spanY, 60);
    view.tx = (W - view.s * (x0 + x1)) / 2;
    view.ty = (H - view.s * (y0 + y1)) / 2;
  }
  renderList(); renderDetail(); draw();
  const sel = listEl.querySelector('.row.selected');
  if (sel) sel.scrollIntoView({ block: 'nearest' });
}

searchEl.addEventListener('input', renderList);
document.getElementById('stats').textContent =
  DATA.totals.mentions + ' mentions · ' + DATA.totals.concepts + ' 概念 · ' + DATA.totals.clusters + ' 个能力簇 · 列表计数 = mentions / 去重 benchmark';

const mq = window.matchMedia('(prefers-color-scheme: dark)');
mq.addEventListener('change', () => { resolveColors(); renderChips(); renderList(); renderDetail(); draw(); });
window.addEventListener('resize', resize);

resolveColors(); renderChips(); renderList();
resize();
</script>
</body>
</html>
